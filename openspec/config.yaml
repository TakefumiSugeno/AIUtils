schema: spec-driven

# ---------------------------------------------------------------------------
# AIUtils の OpenSpec 設定（openspec-kit/config.yaml から生成し、本リポジトリ向けに調整）
#   - キット側の汎用ルールを変更した場合は、こちらへも反映すること
#   - `reviews:` は OpenSpec CLI では解釈されない独自キーです。
#     エージェントへの伝達は context / rules / operations と AGENTS.md で行います。
# ---------------------------------------------------------------------------

githubCopilot:
  cloudAgent: false

reviews:
  required_phases: [propose, apply, archive]
  roles:
    - name: user
      perspective: "要件・ビジネス価値・UX・受け入れ基準"
      phases: [propose, archive]
    - name: se
      perspective: "アーキテクチャ・設計整合・影響範囲・非機能"
      phases: [propose, apply, archive]
    - name: pg
      perspective: "コード品質・可読性・リファクタ・境界値・エラー処理"
      phases: [apply, archive]
    - name: qa
      perspective: "テスト網羅性・仕様妥当性検証・回帰防止・E2Eシナリオ"
      phases: [apply, archive]

  templates:
    review_record: "openspec/templates/review_record.md"
    handover: "openspec/templates/handover.md"
    pr_body: "openspec/templates/pr_body.md"
    checklist:
      propose: "openspec/templates/checklist_propose.md"
      apply_impl: "openspec/templates/checklist_apply_impl.md"
      apply_test: "openspec/templates/checklist_apply_test.md"
      archive: "openspec/templates/checklist_archive.md"

context: |
  Language: Japanese
  All artifacts must be written in Japanese.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  # プロジェクト共通コンテキスト
  - アーキテクチャ: 仕様書駆動開発 (SDD) with OpenSpec
  - 開発フロー: Explore → Propose → Apply → Archive
  - ベースブランチ: main
  - リポジトリの性質: 特定アプリではなく、AI駆動開発で使うツール群（スキル・ワークフロー・プロンプト・テンプレート・スクリプト）を管理・配布するリポジトリ
  - 技術スタック: Markdown（スキル/ルール/テンプレート）, YAML, PowerShell 7（スクリプト。テストは Pester）
  - 成果物の利用者は「他プロジェクトのAIエージェントと開発者」。汎用性（アプリ固有の記述を持ち込まない）と導入容易性を重視する
  - テストの読み替え: スクリプトは Pester による自動テスト、スキル・テンプレート等の文書成果物は「サンプルプロジェクトへの導入・実行による検証シナリオ」をテストとして扱う

  # 共通制約（全アーティファクト・全フェーズで適用）
  - Single Source of Truth: システム仕様の正本は openspec/specs/。OpenSpec管理外への仕様書・タスクの新規作成は禁止（全て openspec/changes/ で管理）
  - テスト先行 (Test First / TDD) で実装する
    - テストの目的は2種類:
      1. 回帰テスト: 既存機能が壊れていないことを継続的に保証する
      2. 仕様変更の妥当性検証: 新しい仕様・変更要求が正しく実装されていることを検証する（仕様書と実装の整合性確認）
    - 単体テスト: 関数・モジュール単位の純粋ロジックを Red → Green → Refactor で検証し、境界値・異常系・エッジケースを網羅する
    - 結合/E2Eテスト: 受け入れ基準（仕様書のシナリオ）から失敗するテストを先に書き、単体テストでは検出できない結合不具合・データフロー・副作用を検証する
    - フェーズやタスクの最後には、テストエビデンス（テストレポート、ログ、E2E失敗時キャプチャ）およびカバレッジレポートを出力して確認・記録する（※テスト成果物はGit管理不要）
  - 自動フォーマット必須: ファイル更新時・コミット前・テスト実行前には、対象ファイル種別に応じたフォーマッタを実行する（コマンドは AGENTS.md 参照）
  - 必須サブエージェントレビュー: 各フェーズで定義された役割（User/SE/PG/QA Agent）によるレビューを実施し、指摘への対応方針を記録してユーザー合意を得る。テンプレートは openspec/templates/ 参照
  - レビューは批判的に行う: 追認ではなく、UX不備・エッジケース・設計漏れ・仕様との乖離を積極的に指摘する

rules:
  # プロポーザル作成時のルール
  proposal:
    - "Explore完了後、Propose開始（openspec new change）直前に必ず作業ツリー確認（必要時 stash 退避）を行い、最新の main から feature/<change-name>（または fix/<change-name>）ブランチを作成・切り替える"
    - "変更の「What & Why」を簡潔に記述（500語以内推奨）"
    - "Non-goals（やらないこと）セクションを含める"
    - "受け入れ基準（完了の定義）を具体的かつ検証可能な形で記述する"
    - "Propose完了時: User Agent・SE Agentによるレビュー必須（checklist_propose.md 使用）"
    - "全役割LGTMで次フェーズへ。指摘がある場合は proposal.md 等を更新して再レビュー"

  # デルタ仕様作成時のルール
  specs:
    - "システムが「何をすべきか」を外部観測可能な振る舞いとして記述"
    - "既存仕様（openspec/specs/）との矛盾がないか確認し、矛盾があれば明記"
    - "各要件に検証可能なシナリオ（受け入れ基準）を付与し、E2E/結合テストの導出元とする"

  # 設計書作成時のルール
  design:
    - "どう実現するか（アーキテクチャ・データフロー・インターフェース等）を記述"
    - "UI/UX変更を伴う場合は、必ず単一ファイルのHTMLモックアップ（openspec/changes/<name>/mockup.html。例: Tailwind CSS + Alpine.js の CDN 利用）を作成し、画面プレビュー・状態変化・アニメーションをブラウザで即座に検証できるようにする"
    - "実装タスクへの分解粒度は「2時間以内で完了する単位」を目安にする"

  # タスクリスト作成時のルール
  tasks:
    - "各タスクにチェックボックス（`- [ ]`）を付与"
    - "依存関係があるタスクは順序を明示"
    - "テストファーストの手順を含める（先にテストを書くタスクを分ける）"
    - "単体テストタスク: 対象関数・モジュールごとに「失敗するテスト作成 → 実装 → リファクタ」のサイクルを明示"
    - "結合/E2Eテストタスク: 仕様書の受け入れシナリオごとに「失敗するシナリオテスト作成 → 結合実装 → 安定化」のサイクルを明示"
    - "テストタスクには「回帰テスト追加」と「仕様妥当性検証テスト追加」の観点を両方含める"
    - "フォーマット実行・全テスト実行・エビデンス確認のタスクを最終段に含める"

operations:
  apply:
    guidance:
      - "作業開始前に、現在のブランチが feature/<change-name> 等のトピックブランチであることを確認する（main / main への直接コミット禁止）"
      - "タスク完了前に必ず自動フォーマットを実行する"
      - "タスク完了前にテストを実行し、テストエビデンスおよびカバレッジレポートを出力・確認する（Git管理不要）"
      - "単体テスト: Red-Green-Refactorサイクルを厳守し、境界値・異常系を網羅する。Red（失敗）を実際に確認した事実をレビュー記録に残す"
      - "結合/E2Eテスト: 仕様書の受け入れ基準からテストケースを導出し、シナリオベースで検証する"
      - "UIモック（mockup.html）が存在する場合、デザイン・配色・レイアウト・情報階層を勝手に簡略化・改変せず忠実に再現する"
      - "タスク完了時に tasks.md のチェックボックスを `- [ ]` → `- [x]` に更新する"
      - "実装で設計課題が発覚したら即座に停止し、アーティファクト更新を提案する（Fluid Workflow）"
      - "タスク完了前に必須レビュー実施（実装タスク: PG Agent、テストタスク: QA Agent）"
      - "レビュー記録は openspec/changes/<name>/reviews.md にテンプレート（review_record.md）準拠で追記し、指摘への対応方針（採用/保留/却下＋理由）を明記する"
      - "全指摘クローズ（LGTM）でタスク完了 [x]。保留指摘は「申し送り事項」として reviews.md および Archive時の handover.md に記録"
      - "タスク完了ごとに実装・tasks.md・reviews.md をまとめて commit する（Conventional Commits 形式、scope は change 名）"

  archive:
    guidance:
      - "実装成果物の最終確認（テスト・ビルド・動作確認）を行ってからアーカイブする"
      - "デルタ仕様をメイン仕様（openspec/specs/）に反映する（openspec archive による同期、または事前の sync）"
      - "アーカイブ前に関連ドキュメント（README等）があれば同期更新する"
      - "Archive前: 全役割（User/SE/PG/QA Agent）による総括レビュー必須（checklist_archive.md 使用：テスト結果・エビデンス確認含む）"
      - "変更サマリ・テスト結果・保留指摘・将来の改善候補を handover.md（テンプレート: handover.md）に記録する"
      - "ユーザー最終合意記録後に openspec archive 実行"
      - "Archive完了コミットを push 後（ユーザー合意必須）、gh pr create で main 向け Pull Request を作成する。本文は pr_body.md テンプレートに従い OpenSpec 成果物から構成する"
      - "PRのマージは Merge commit（gh pr merge --merge --delete-branch）で行い、マージ後に main を最新化してローカルブランチを削除する"
